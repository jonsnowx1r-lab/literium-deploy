    <!--
      شاشة بداية ثابتة (بلا أي جافاسكربت أو ملف CSS خارجي) — تُرسَم فوراً
      بمجرد وصول أول بايتات من هذا الملف نفسه، قبل تحميل حزمة React بأكملها
      (main.tsx) بوقت طويل. كان <div id="root"></div> فارغاً تماماً بلا أي
      محتوى ثابت، فأي تأخر في التحميل (شبكة بطيئة، أو خادم Render لا يزال
      يستيقظ من سبات) يعني شاشة فارغة قريبة من السواد (خلفية الوضع الداكن
      #090d16 نفسها) بلا أي شعار أو مؤشر تحميل — هذا بالضبط ما وُصف بـ"الصفحة
      السوداء". هذا لا يُلغي إطلاقاً أي انتظار يحدث قبل وصول أي بايتات من
      الخادم أصلاً (تلك المرحلة خارج نطاق أي صفحة ويب مهما كانت — لا يمكن
      رسم محتوى لصفحة لم تصل بعد)، لكنه يضمن أن أي جزء من الانتظار يحدث
      بعد وصول هذا الملف نفسه (تحميل حزمة JS، تهيئة أولية) يظهر بهوية
      المنصة الحقيقية بدل فراغ. React نفسه يستبدل هذا المحتوى تلقائياً
      وبلا أي وميض عند التركيب (render يستبدل children الخاص بـ#root).
    -->
